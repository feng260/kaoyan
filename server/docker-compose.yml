# 自建服务器部署:docker compose up -d --build
# 变量从同目录 .env 读取(compose 自动加载),首次部署请先 cp .env.example .env 并填写
services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 server/.env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: yanzhong
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      retries: 20
    mem_limit: 768m
    memswap_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 容器内网地址;此处覆盖 .env 里的 DATABASE_URL,本地开发那条连接串不参与容器部署
      DATABASE_URL: "mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/yanzhong"
      JWT_SECRET: ${JWT_SECRET:?请在 server/.env 中设置 JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-2h}
      NODE_ENV: production
      PORT: 3000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # AI 计划生成需要 LLM_API_KEY;未配置时生成接口返回 AI_NOT_CONFIGURED
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-120000}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-8192}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-研钟 <no-reply@yanzhong.app>}
      INVITE_CODES: ${INVITE_CODES:-}
      AI_ALERT_DAILY_TOKENS: ${AI_ALERT_DAILY_TOKENS:-8000000}
      AI_ALERT_JOB_TOKENS: ${AI_ALERT_JOB_TOKENS:-500000}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      # 3000 只绑定 127.0.0.1,前面是 Caddy(会覆写来源 IP 头),可以信任代理头:
      # Caddy 覆写 X-Forwarded-For / X-Real-IP,客户端无法伪造来源 IP 绕过限流
      TRUST_PROXY: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # 管理端上传的 APK 落在 /app/releases,不挂卷会在容器重建后全部丢失
      - releases-data:/app/releases
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    mem_limit: 768m
    memswap_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql-data:
  releases-data: