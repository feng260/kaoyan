# 自建服务器部署:docker compose up -d --build
# 变量从同目录 .env 读取(compose 自动加载),首次部署请先 cp .env.example .env 并填写
services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 server/.env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: yanzhong
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 容器内网地址;此处覆盖 .env 里的 DATABASE_URL,本地开发那条连接串不参与容器部署
      DATABASE_URL: "mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/yanzhong"
      JWT_SECRET: ${JWT_SECRET:?请在 server/.env 中设置 JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-2h}
      NODE_ENV: production
      PORT: 3000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # 直接对外暴露 3000 端口、前面没有反向代理,必须为 false:
      # 置 true 会让攻击者伪造 X-Forwarded-For 绕过限流并伪造来源 IP
      TRUST_PROXY: "false"
    ports:
      - "3000:3000"
    volumes:
      # 管理端上传的 APK 落在 /app/releases,不挂卷会在容器重建后全部丢失
      - releases-data:/app/releases
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  mysql-data:
  releases-data: